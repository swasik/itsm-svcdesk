# ai-generated: 40% - the provider block, the judge block and the shapes are the course's template (unchanged); the student chose every question and fact from where /retrieve and `itsmlab answer 8 --regression` showed it sits, with Claude Code (Opus 5.5) as the student; see DEFENSE.md, Suite
# promptfoo.yaml - the suite (AI-SPEC.md A-11 to A-15). Design: every answerable test asserts a fact that sits in
# exactly one chunk, past the chunk's first quarter, in the document that ranks first, AND the whole bracketed
# citation of that document; three unanswerable tests assert the prompt's own refusal words.
#   no-context, skip-top, truncated -> the fact is gone      no-names, default-prompt -> the citation is gone

description: "Lab 8 suite over my semester's corpus (rag/corpus.yaml): facts plus [<doc>] citations, and refusals"

prompts:
  - file://prompts/answer.txt

providers:                                        # A-11: the course's answer step, exactly this block
  - id: http
    config:
      url: "{{env.ANSWER_URL}}"
      method: POST
      body:
        question: "{{question}}"
        prompt: "{{prompt}}"
      transformResponse: json.answer

defaultTest:
  options:
    provider:                                     # the judge of model-graded assertions (none used: see DEFENSE.md)
      id: ollama:chat:qwen3:1.7b
      config:
        think: false
        temperature: 0

tests:
  # ---- Lab 1 ----
  - description: "L1-owner: the C2 decision's service owner, from DECISIONS.md"
    vars: {question: "Who is the service owner of the decision on closed tickets and reopening?"}
    assert:
      - {type: icontains, value: "Incident Manager"}
      - {type: icontains, value: "[DECISIONS.md]"}
  - description: "L1-p3: the P3 acknowledgement and resolution targets, in that order"
    vars: {question: "What are the acknowledgement and resolution targets of a P3 ticket?"}
    assert:
      - {type: regex, value: "\\b4\\s?(h|hours)\\b\\D{1,40}\\b24\\s?(h|hours)\\b"}
      - {type: icontains, value: "[specs/spec.md]"}
  - description: "L1-friday: the rejected alternative's due time for a Friday-evening P1"
    vars: {question: "Under the rejected alternative, when would a P1 raised on Friday at 17:00 be due for acknowledgement?"}
    assert:
      - {type: icontains, value: "08:15"}
      - {type: icontains, value: "[DECISIONS.md]"}
  # ---- Lab 2 ----
  - description: "L2-skew: how late the clock-skewed commits were"
    vars: {question: "By how much were the clock-skewed commits later than the deployment that shipped them?"}
    assert:
      - {type: icontains-any, value: ["thirty seconds", "30 seconds", "30 s"]}
      - {type: icontains-any, value: ["fifteen minutes", "15 minutes", "15 min"]}
      - {type: icontains, value: "[EDGE-CASES.md]"}
  # ---- Lab 3 ----
  - description: "L3-budget: the availability error budget in minutes"
    vars: {question: "What is the availability error budget of the /kb/search SLO in minutes?"}
    assert:
      - {type: icontains, value: "201.6"}
      - {type: icontains, value: "[slo.md]"}
  - description: "L3-p99: the measured p99 and p99.9, each tied to its name"
    vars: {question: "What p99 and p99.9 latency did the measurement of /kb/search show?"}
    assert:
      - {type: regex, value: "p99\\D{0,30}236"}
      - {type: regex, value: "p99\\.9\\D{0,30}265"}
      - {type: icontains, value: "[slo.md]"}
  - description: "L3-ladder: how many boundaries the bucket ladder has"
    vars: {question: "How many boundaries does the latency histogram's bucket ladder have?"}
    assert:
      - {type: regex, value: "\\b23\\b"}
      - {type: icontains, value: "[slo.md]"}
  # ---- Lab 4 ----
  - description: "L4-mem: the recommendation service's container memory, before and after"
    vars: {question: "How much did the recommendation service's container memory move during the incident?"}
    assert:
      - {type: icontains, value: "53.5"}
      - {type: icontains, value: "57.1"}
      - {type: icontains, value: "[postmortem.md]"}
  - description: "L4-mtta: the incident's MTTA"
    vars: {question: "What was the MTTA of the incident?"}
    assert:
      - {type: regex, value: "\\b79\\s?(s|sec|seconds)\\b"}
      - {type: icontains, value: "[postmortem.md]"}
  # ---- Lab 5 ----
  - description: "L5-semgrep: Semgrep's precision and recall on the canary set, each tied to its name"
    vars: {question: "What precision and recall did Semgrep reach on the canary set?"}
    assert:
      - {type: regex, value: "[Pp]recision\\D{0,60}0\\.33"}
      - {type: regex, value: "[Rr]ecall\\D{0,20}0\\.25|0\\.33\\d*\\D{1,15}0\\.25"}     # "recall 0.25", or "0.3333 and 0.25, respectively"
      - {type: icontains, value: "[TRIAGE.md]"}
  # ---- Lab 6 ----
  - description: "L6-hang: what the hang cost on the flag path, measured and predicted"
    vars: {question: "How many failed searches did the hang cost in the flag run, and how many were predicted?"}
    assert:
      - {type: regex, value: "\\b84\\b"}
      - {type: regex, value: "\\b88\\b"}
      - {type: icontains, value: "[BLAST-RADIUS.md]"}
  - description: "L6-readback: what flagd served at the honest flag run's 50 % step"
    vars: {question: "What did flagd's read-backs show at each step of the honest flag run?"}
    assert:
      - {type: icontains, value: "19/40"}
      - {type: icontains, value: "[BLAST-RADIUS.md]"}
  # ---- Lab 7 ----
  - description: "L7-stress: how long the cassandra-stress run took"
    vars: {question: "How long did the cassandra-stress run take from docker run to exit?"}
    assert:
      - {type: icontains-any, value: ["39 s", "39 seconds"]}
      - {type: icontains, value: "[EVIDENCE.md]"}
  - description: "L7-repo-buckets: the bucket count of events_by_repo"
    vars: {question: "How many buckets does the events_by_repo table use?"}
    assert:
      - {type: regex, value: "\\b3\\b"}
      - {type: icontains, value: "[EVIDENCE.md]"}
  - description: "L7-bytes: the hot partition's size per row"
    vars: {question: "About how many bytes per row did the instructor's hot partition take?"}
    assert:
      - {type: icontains, value: "66"}
      - {type: icontains, value: "[EVIDENCE.md]"}
  # ---- unanswerable: the prompt's own refusal (rule 4), not promptfoo's is-refusal ----
  - description: "U-bill: nothing in the corpus says what hosting cost"
    vars: {question: "What was svcdesk's cloud hosting bill in October 2026?"}
    assert:
      - {type: icontains-any, value: ["don't know", "do not know", "excerpts do not say", "does not say", "not mentioned", "not provided"]}
  - description: "U-cloud: no cloud provider anywhere in the corpus"
    vars: {question: "Which cloud provider hosts the svcdesk production database?"}
    assert:
      - {type: icontains-any, value: ["don't know", "do not know", "excerpts do not say", "does not say", "not mentioned", "not provided"]}
  - description: "U-students: the corpus holds no course statistics"
    vars: {question: "How many students passed the course in 2025?"}
    assert:
      - {type: icontains-any, value: ["don't know", "do not know", "excerpts do not say", "does not say", "not mentioned", "not provided"]}
